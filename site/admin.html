<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JINHEXI 后台管理</title>
    <link rel="stylesheet" href="styles.css?v=20260815e" />
    <link rel="stylesheet" href="storefront-redesign.css?v=20260815e" />
  </head>
  <body class="admin-body">
    <main class="admin-shell">
      <section class="admin-login" data-login-panel>
        <div>
          <p class="eyebrow">JINHEXI Admin</p>
          <h1>100% Cashmere Content Console</h1>
          <p>管理前台产品、羊绒配件、博文和访问数据。这里维护的内容会直接进入客户可看的独立站页面。</p>
        </div>
        <form class="login-form" data-login-form>
          <label>
            密码
            <input type="password" name="password" autocomplete="current-password" required />
          </label>
          <button class="button primary" type="submit">登录</button>
          <p class="admin-note" data-login-status>请输入管理员密码后进入后台。</p>
        </form>
      </section>

      <section class="admin-workspace" data-admin-workspace hidden>
        <header class="admin-topbar">
          <div>
            <p class="eyebrow">JINHEXI Admin</p>
            <h2>100% Cashmere Site Manager</h2>
            <p>产品目录、Amazon 按钮、图片图册、SEO 内容和访问数据统一维护。</p>
          </div>
          <div class="admin-actions">
            <a class="button secondary" href="index.html">查看网站</a>
            <button class="button secondary" type="button" data-logout>退出登录</button>
          </div>
        </header>

        <div class="admin-tabs" role="tablist" aria-label="后台分区">
          <button class="tab active" type="button" data-tab="products">产品</button>
          <button class="tab" type="button" data-tab="posts">博文</button>
          <button class="tab" type="button" data-tab="analytics">数据</button>
        </div>

        <section class="admin-overview" aria-label="站点数据概览">
          <div class="metric">
            <strong>总浏览</strong>
            <span data-metric="views">0</span>
          </div>
          <div class="metric">
            <strong>今日浏览</strong>
            <span data-metric="today">0</span>
          </div>
          <div class="metric">
            <strong>产品数</strong>
            <span data-metric="products">0</span>
          </div>
          <div class="metric">
            <strong>博文数</strong>
            <span data-metric="posts">0</span>
          </div>
        </section>

        <section class="admin-panel active" data-panel="products">
          <div class="panel-heading">
            <h3>产品管理</h3>
            <button class="button primary" type="button" data-add-product>新增产品</button>
          </div>
          <div class="editor-list" data-product-list></div>
          <button class="button primary save-button" type="button" data-save-products>保存产品</button>
        </section>

        <section class="admin-panel" data-panel="posts">
          <div class="panel-heading">
            <h3>博文管理</h3>
            <button class="button primary" type="button" data-add-post>新增博文</button>
          </div>
          <div class="editor-list" data-post-list></div>
          <button class="button primary save-button" type="button" data-save-posts>保存博文</button>
        </section>

        <section class="admin-panel" data-panel="analytics">
          <div class="panel-heading">
            <h3>浏览数据</h3>
          </div>
          <div class="analytics-grid">
            <div class="metric">
              <strong>总浏览</strong>
              <span data-metric="analytics-views">0</span>
            </div>
            <div class="metric">
              <strong>今日浏览</strong>
              <span data-metric="analytics-today">0</span>
            </div>
            <div class="metric">
              <strong>产品数</strong>
              <span data-metric="analytics-products">0</span>
            </div>
            <div class="metric">
              <strong>博文数</strong>
              <span data-metric="analytics-posts">0</span>
            </div>
          </div>
          <div class="analytics-list" data-analytics-list></div>
        </section>

        <p class="admin-status" data-status></p>
      </section>
    </main>
    <script src="admin.js?v=20260815e"></script>
  </body>
</html>
