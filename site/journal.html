<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JINHEXI Journal | Cashmere SEO Articles</title>
    <meta name="description" content="JINHEXI journal for cashmere care guides, knitwear styling, and SEO-friendly brand articles." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="JINHEXI home">
        <img class="brand-logo" src="assets/logo-jinhexi.svg" alt="JINHEXI" />
      </a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="/" data-nav-home>Home</a>
        <a href="/#catalog" data-nav-catalog>Catalog</a>
        <a href="/#social" data-nav-social>Social</a>
      </nav>
      <a class="header-action" href="/" data-back-link>Back</a>
    </header>

    <main class="journal-page">
      <section class="journal-hero">
        <p class="eyebrow" data-journal-eyebrow>Journal</p>
        <h1 data-journal-heading>SEO articles for premium cashmere knitwear.</h1>
        <p data-journal-intro>Publish care guides, style notes, and brand stories here so the site can rank for product-intent and education keywords.</p>
      </section>

      <section class="section journal-listing">
        <div class="post-grid" data-posts></div>
      </section>
    </main>
    <script src="i18n.js"></script>
    <script src="journal.js"></script>
  </body>
</html>
